# ============================================================
# deploy.yml — Migageros S.A. CI/CD Pipeline
# Automatización de Infraestructura como Código (IaC) en Azure
# Modo: Self-Hosted Runner (Agente empresarial local)
# ============================================================

name: Migageros SA Infrastructure CI/CD

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'infra/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'

env:
  AZURE_LOCATION: centralus
  RG_DEV: rg-migageros-erp-dev
  RG_PROD: rg-migageros-erp-prod

jobs:
  # -------------------------------------------------------------
  # FASE 1: VALIDACIÓN Y LINTING
  # -------------------------------------------------------------
  validate:
    name: "1. Validar Código Bicep"
    runs-on: self-hosted
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Compilar archivo Bicep
        run: az bicep build --file infra/main.bicep

  # -------------------------------------------------------------
  # FASE 2: SIMULACIÓN DE CAMBIOS (What-If)
  # -------------------------------------------------------------
  preview:
    name: "2. Simulación de Cambios (What-If)"
    runs-on: self-hosted
    needs: validate
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Asegurar que el Resource Group existe
        run: az group create --name ${{ env.RG_DEV }} --location ${{ env.AZURE_LOCATION }}

      - name: Ejecutar Simulación What-If
        run: |
          az deployment group what-if `
            --resource-group ${{ env.RG_DEV }} `
            --template-file infra/main.bicep `
            --parameters infra/parameters/dev.bicepparam `
            --parameters sqlAdminPassword="Migageros2026!P@ss"

  # -------------------------------------------------------------
  # FASE 3: DESPLIEGUE A AMBIENTE DEV (Automático)
  # -------------------------------------------------------------
  deploy-dev:
    name: "3. Despliegue en Ambiente DEV"
    runs-on: self-hosted
    needs: preview
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Asegurar que el Resource Group existe
        run: az group create --name ${{ env.RG_DEV }} --location ${{ env.AZURE_LOCATION }}

      - name: Desplegar Infraestructura en Azure
        run: |
          az deployment group create `
            --name "deploy-dev-${{ github.run_number }}" `
            --resource-group ${{ env.RG_DEV }} `
            --template-file infra/main.bicep `
            --parameters infra/parameters/dev.bicepparam `
            --parameters sqlAdminPassword="Migageros2026!P@ss"
