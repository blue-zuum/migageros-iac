# ============================================================
# deploy.yml — Migageros S.A. CI/CD Pipeline
# Automatización de Infraestructura como Código (IaC) en Azure
# ============================================================

name: Migageros SA Infrastructure CI/CD

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'infra/**'
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'

permissions:
  id-token: write
  contents: read

env:
  AZURE_LOCATION: centralus
  RG_DEV: rg-migageros-erp-dev
  RG_PROD: rg-migageros-erp-prod

jobs:
  # -------------------------------------------------------------
  # FASE 1: VALIDACIÓN Y LINTING
  # -------------------------------------------------------------
  validate:
    name: "1. Validar Código Bicep"
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Azure Bicep CLI
        run: az bicep install

      - name: Compilar archivo Bicep
        run: az bicep build --file infra/main.bicep

  # -------------------------------------------------------------
  # FASE 2: SIMULACIÓN DE CAMBIOS (What-If)
  # -------------------------------------------------------------
  preview:
    name: "2. Simulación de Cambios (What-If)"
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Autenticación en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Crear Resource Group temporal si no existe
        run: |
          az group create --name ${{ env.RG_DEV }} --location ${{ env.AZURE_LOCATION }}

      - name: Ejecutar Simulación What-If
        run: |
          az deployment group what-if \
            --resource-group ${{ env.RG_DEV }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}"

  # -------------------------------------------------------------
  # FASE 3: DESPLIEGUE A AMBIENTE DEV (Automático)
  # -------------------------------------------------------------
  deploy-dev:
    name: "3. Despliegue en Ambiente DEV"
    runs-on: ubuntu-latest
    needs: preview
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: development
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Autenticación en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Crear Resource Group DEV
        run: |
          az group create --name ${{ env.RG_DEV }} --location ${{ env.AZURE_LOCATION }}

      - name: Desplegar Infraestructura en Azure
        run: |
          az deployment group create \
            --name "deploy-dev-${{ github.run_number }}" \
            --resource-group ${{ env.RG_DEV }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}"

  # -------------------------------------------------------------
  # FASE 4: DESPLIEGUE A PRODUCCIÓN (Con Aprobación)
  # -------------------------------------------------------------
  deploy-prod:
    name: "4. Despliegue en Ambiente PROD"
    runs-on: ubuntu-latest
    needs: preview
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Autenticación en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Crear Resource Group PROD
        run: |
          az group create --name ${{ env.RG_PROD }} --location ${{ env.AZURE_LOCATION }}

      - name: Desplegar Infraestructura en Producción
        run: |
          az deployment group create \
            --name "deploy-prod-${{ github.run_number }}" \
            --resource-group ${{ env.RG_PROD }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/prod.bicepparam \
            --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}"
